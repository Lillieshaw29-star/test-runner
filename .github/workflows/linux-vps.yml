name: Linux VPS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: linux-vps
  cancel-in-progress: false

env:
  STATE_HOST: ghstate@84.247.173.80
  STATE_PATH: /home/ghstate/state
  MAX_STATE_MB: 8000
  MIN_ITEMS: 4

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af 2>/dev/null || true
          df -h /

      - name: SSH key (optional)
        id: sshkey
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          if [ -n "$SSH_KEY" ]; then
            mkdir -p ~/.ssh
            echo "$SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan -H 84.247.173.80 >> ~/.ssh/known_hosts 2>/dev/null
            echo "enabled=true" >> $GITHUB_OUTPUT
            echo "الحفظ على السيرفر مفعّل"
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "SERVER_SSH_KEY مش مضبوط — هيستخدم data/ في الـ repo"
          fi

      - name: Prepare work disk
        run: |
          sudo mkdir -p /mnt/work && sudo chown -R runner:runner /mnt/work
          mkdir -p /mnt/work/bulk
          ln -sfn /mnt/work "$HOME/vps"
          sudo apt-get install -y rsync -qq

      - name: Restore from server
        id: restore
        if: steps.sshkey.outputs.enabled == 'true'
        run: |
          if ssh -n -o BatchMode=yes -o ConnectTimeout=25 "$STATE_HOST" \
               "mkdir -p '$STATE_PATH/work' '$STATE_PATH/home' && echo REACHABLE"; then
            echo "reachable=true" >> $GITHUB_OUTPUT
            rsync -az "$STATE_HOST:$STATE_PATH/work/" /mnt/work/ || true
            rsync -az \
              --exclude 'work/' --exclude 'runners/' --exclude '_diag/' \
              --exclude '.cache/' --exclude '.npm/' --exclude '.dotnet/' \
              --exclude '.credentials*' --exclude 'vps' \
              "$STATE_HOST:$STATE_PATH/home/" /home/runner/ || true
            echo "الاسترجاع تم — $(du -sh /mnt/work | cut -f1)"
          else
            echo "reachable=false" >> $GITHUB_OUTPUT
            echo "::error::السيرفر مش متاح — الحفظ هيتوقف حماية للنسخة الموجودة"
          fi

      - name: Restore from repo
        if: steps.sshkey.outputs.enabled != 'true'
        run: |
          [ -d data ] && cp -r data/. /mnt/work/ 2>/dev/null || true

      - name: Create control scripts
        run: |
          cd /mnt/work
          [ -f packages.txt ] || printf '# حزمة apt في كل سطر\nfirefox\ngit\npython3-pip\n' > packages.txt
          [ -f setup.sh ]    || printf '#!/bin/bash\n# تعديلات النظام — كل جلسة\n'            > setup.sh
          [ -f startup.sh ]  || printf '#!/bin/bash\n# تشغيل برامجك — كل جلسة\necho ready\n'  > startup.sh
          [ -f shutdown.sh ] || printf '#!/bin/bash\n# إيقاف آمن قبل الحفظ الأخير\n'          > shutdown.sh
          chmod +x setup.sh startup.sh shutdown.sh

      - name: System setup
        run: bash /mnt/work/setup.sh || echo "setup.sh رجّع خطأ — بكمل"

      - name: Install packages
        run: |
          sudo apt-get update -qq
          PKGS=$(grep -v '^\s*#' /mnt/work/packages.txt | grep -v '^\s*$' | tr '\n' ' ')
          [ -n "$PKGS" ] && sudo apt-get install -y $PKGS || true

      - name: Desktop + RDP
        env:
          RDP_PASS: ${{ secrets.RDP_PASS }}
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends \
            xfce4 xfce4-terminal dbus-x11 xrdp xorgxrdp
          echo "xfce4-session" > ~/.xsession
          sudo adduser xrdp ssl-cert
          echo "runner:$RDP_PASS" | sudo chpasswd
          sudo systemctl enable --now xrdp
          sudo systemctl restart xrdp

      - name: Tailscale (RDP + SSH)
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --reset --ssh \
            --authkey ${{ secrets.TS_KEY }} \
            --hostname github-runner
          echo "==================================="
          echo "  SSH : ssh runner@github-runner"
          echo "  RDP : $(tailscale ip -4)   user: runner"
          echo "  Data: ~/vps"
          echo "==================================="

      - name: Run startup script
        run: |
          nohup bash /mnt/work/startup.sh > /mnt/work/startup.log 2>&1 &
          sleep 3
          tail -20 /mnt/work/startup.log 2>/dev/null || true

      - name: Keep alive + hourly backup
        run: |
          SAFE="${{ steps.sshkey.outputs.enabled }}${{ steps.restore.outputs.reachable }}"
          end=$(( $(date +%s) + 300*60 ))
          next=$(( $(date +%s) + 3600 ))
          while [ $(date +%s) -lt $end ]; do
            if [ "$SAFE" = "truetrue" ] && [ $(date +%s) -ge $next ]; then
              rsync -az --delete --exclude 'bulk/' \
                --backup --backup-dir="../trash/$(date +%F)" \
                /mnt/work/ "$STATE_HOST:$STATE_PATH/work/" \
                && echo "$(date '+%H:%M') حفظ دوري"
              next=$(( $(date +%s) + 3600 ))
            fi
            echo "$(date '+%H:%M:%S') alive"
            sleep 300
          done

      - name: Graceful stop
        if: always()
        run: |
          echo "-- إيقاف آمن --"
          timeout 120 bash /mnt/work/shutdown.sh || echo "shutdown.sh خلص/انتهت مهلته"
          MYPID=$$
          for sig in TERM KILL; do
            for pid in $(pgrep -f '/mnt/work' 2>/dev/null || true); do
              [ "$pid" = "$MYPID" ] && continue
              [ "$pid" = "$PPID" ] && continue
              kill -"$sig" "$pid" 2>/dev/null || true
            done
            [ "$sig" = "TERM" ] && sleep 8
          done
          sync

      - name: Safety checks
        id: safe
        if: always()
        run: |
          COUNT=$(find /mnt/work -maxdepth 1 -mindepth 1 2>/dev/null | wc -l)
          SIZE=$(du -sm --exclude=bulk /mnt/work 2>/dev/null | cut -f1)
          SIZE=${SIZE:-0}
          echo "عناصر: $COUNT (أقل حد $MIN_ITEMS) | حجم: ${SIZE}MB (أقصى $MAX_STATE_MB)"
          OK=true
          if [ "$COUNT" -lt "$MIN_ITEMS" ]; then
            OK=false
            echo "::warning::بس $COUNT عنصر — الاسترجاع فشل غالبًا. الحفظ اتوقف"
          fi
          if [ "$SIZE" -gt "$MAX_STATE_MB" ]; then
            OK=false
            echo "::warning::${SIZE}MB فوق الحد — حط الكبير في /mnt/work/bulk/"
          fi
          if [ "${{ steps.restore.outputs.reachable }}" = "false" ]; then
            OK=false
            echo "::warning::الاسترجاع ما وصلش للسيرفر — ممنوع الحفظ"
          fi
          echo "ok=$OK" >> $GITHUB_OUTPUT

      - name: Final save to server
        if: always() && steps.sshkey.outputs.enabled == 'true' && steps.safe.outputs.ok == 'true'
        run: |
          rsync -az --delete --exclude 'bulk/' \
            --backup --backup-dir="../trash/$(date +%F)" \
            /mnt/work/ "$STATE_HOST:$STATE_PATH/work/"
          rsync -az --delete \
            --backup --backup-dir="../trash/$(date +%F)" \
            --exclude 'work/' --exclude 'runners/' --exclude '_diag/' \
            --exclude '.cache/' --exclude '.npm/' --exclude '.dotnet/' \
            --exclude '.credentials*' --exclude 'vps' \
            /home/runner/ "$STATE_HOST:$STATE_PATH/home/"
          ssh -n -o BatchMode=yes "$STATE_HOST" \
            "find '$STATE_PATH/trash' -maxdepth 1 -type d -mtime +7 -exec rm -rf {} + 2>/dev/null; true"
          echo "اتحفظ: مساحة الشغل + مجلد البيت"

      - name: Final save to repo
        if: always() && steps.sshkey.outputs.enabled != 'true' && steps.safe.outputs.ok == 'true'
        run: |
          mkdir -p data
          rsync -a --delete --exclude 'bulk/' /mnt/work/ data/ 2>/dev/null || true
          git add -A data/

      - name: Heartbeat (keeps schedule alive)
        if: always()
        run: |
          date -u '+%Y-%m-%d %H:%M UTC' > .heartbeat
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .heartbeat
          if ! git diff --staged --quiet; then
            git commit -m "heartbeat $(date -u '+%F %H:%M')" || true
            git pull --rebase --autostash origin main || true
            git push || echo "::warning::الدفع فشل — الجدولة ممكن تتعطّل بعد 60 يوم"
          fi

      - name: Tailscale logout
        if: always()
        run: sudo tailscale logout
