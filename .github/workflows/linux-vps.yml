name: Linux VPS

on:
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'

concurrency:
  group: linux-vps
  cancel-in-progress: false

env:
  STATE_HOST: ghstate@84.247.173.80
  STATE_PATH: /home/ghstate/state
  MAX_STATE_MB: 8000
  MIN_ITEMS: 4

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af 2>/dev/null || true
          df -h /

      - name: SSH key (optional)
        id: sshkey
        env:
          SSH_KEY: ${{ secrets.STATE_KEY }}
        run: |
          if [ -n "$SSH_KEY" ]; then
            mkdir -p ~/.ssh
            echo "$SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan -H 84.247.173.80 >> ~/.ssh/known_hosts 2>/dev/null
            echo "enabled=true" >> $GITHUB_OUTPUT
            echo "Backup enabled"
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
          fi

      - name: Write tunnel key
        env:
          TUNNEL_KEY: ${{ secrets.TUNNEL_KEY }}
        run: |
          if [ -n "$TUNNEL_KEY" ]; then
            echo "$TUNNEL_KEY" > /tmp/tunnel_key
            chmod 600 /tmp/tunnel_key
          fi

      - name: Prepare work disk
        run: |
          sudo mkdir -p /mnt/work && sudo chown -R runner:runner /mnt/work
          mkdir -p /mnt/work/bulk
          ln -sfn /mnt/work "$HOME/vps"
          sudo apt-get install -y rsync -qq

      - name: Restore from server
        id: restore
        if: steps.sshkey.outputs.enabled == 'true'
        run: |
          if ssh -n -o BatchMode=yes -o ConnectTimeout=25 "$STATE_HOST" \
            "mkdir -p '$STATE_PATH/work' '$STATE_PATH/home' && echo REACHABLE"; then
            echo "reachable=true" >> $GITHUB_OUTPUT
            rsync -az "$STATE_HOST:$STATE_PATH/work/" /mnt/work/ || true
            rsync -az \
              --exclude 'work/' --exclude 'runners/' --exclude '_diag/' \
              --exclude '.cache/' --exclude '.npm/' --exclude '.dotnet/' \
              --exclude '.credentials*' --exclude 'vps' \
              "$STATE_HOST:$STATE_PATH/home/" /home/runner/ || true
            echo "Restore done: $(du -sh /mnt/work | cut -f1)"
          else
            echo "reachable=false" >> $GITHUB_OUTPUT
            echo "::error::State server unreachable"
          fi

      - name: Restore from repo
        if: steps.sshkey.outputs.enabled != 'true'
        run: |
          [ -d data ] && cp -r data/. /mnt/work/ 2>/dev/null || true

      - name: Create control scripts
        run: |
          cd /mnt/work
          [ -f packages.txt ] || printf 'python3-pip\nopenssh-client\n' > packages.txt
          [ -f setup.sh ]    || printf '#!/bin/bash\n' > setup.sh
          [ -f shutdown.sh ] || printf '#!/bin/bash\n' > shutdown.sh
          chmod +x setup.sh shutdown.sh
          [ -f /tmp/tunnel_key ] && cp /tmp/tunnel_key /mnt/work/tunnel_key && chmod 600 /mnt/work/tunnel_key || true
          python3 - << 'PYEOF'
import os
script = r"""#!/bin/bash
WORK=/mnt/work
APP="$WORK/kw_tester_app.py"
LOG="$WORK/kw_tester.log"
CFG="$WORK/kw_notify.conf"
US="129.121.125.186"
[ -f "$CFG" ] && source "$CFG"
tg() { [ -n "$TG_TOKEN" ] && curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" -d "chat_id=${TG_CHAT}" --data-urlencode "text=$1" >/dev/null 2>&1 || true; }
echo "=== startup $(date) ==="
pip3 install flask playwright requests --break-system-packages -q 2>/dev/null || pip3 install flask playwright requests -q 2>/dev/null || true
python3 -m playwright install chromium 2>/dev/null || true
[ -f "$APP" ] || curl -fsSL "https://raw.githubusercontent.com/Lillieshaw29-star/test-runner/main/kw_tester_app.py" -o "$APP" || { tg "Runner: download failed"; exit 1; }
nohup python3 "$APP" 5555 > "$LOG" 2>&1 &
TPID=$!
sleep 6
kill -0 $TPID 2>/dev/null || { tail -20 "$LOG"; tg "Runner: tester failed"; exit 1; }
if [ -f "$WORK/tunnel_key" ]; then
  nohup ssh -N -R 5556:localhost:5555 -i "$WORK/tunnel_key" -o StrictHostKeyChecking=no -o ServerAliveInterval=20 -o ServerAliveCountMax=3 root@${US} > "$WORK/tunnel.log" 2>&1 &
  sleep 4
  tg "Runner ready - use bot to control"
else
  tg "Runner: tester running but tunnel missing"
fi
echo "=== done ==="
"""
with open('/mnt/work/startup.sh', 'w') as f:
    f.write(script)
os.chmod('/mnt/work/startup.sh', 0o755)
print("startup.sh written")
PYEOF

      - name: System setup
        run: bash /mnt/work/setup.sh || true

      - name: Install packages
        run: |
          sudo apt-get update -qq
          PKGS=$(grep -v '^\s*#' /mnt/work/packages.txt | grep -v '^\s*$' | tr '\n' ' ')
          [ -n "$PKGS" ] && sudo apt-get install -y $PKGS || true

      - name: Desktop + RDP
        env:
          RDP_PASS: ${{ secrets.RDP_PASS }}
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends \
            xfce4 xfce4-terminal dbus-x11 xrdp xorgxrdp
          echo "xfce4-session" > ~/.xsession
          sudo adduser xrdp ssl-cert
          echo "runner:$RDP_PASS" | sudo chpasswd
          sudo systemctl enable --now xrdp
          sudo systemctl restart xrdp

      - name: Tailscale (RDP + SSH)
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --reset --ssh \
            --authkey ${{ secrets.TS_KEY }} \
            --hostname github-runner
          echo "SSH: runner@github-runner  |  RDP: $(tailscale ip -4)"

      - name: Run startup script
        run: |
          nohup bash /mnt/work/startup.sh > /mnt/work/startup.log 2>&1 &
          sleep 3
          tail -20 /mnt/work/startup.log 2>/dev/null || true

      - name: Keep alive + hourly backup
        run: |
          SAFE="${{ steps.sshkey.outputs.enabled }}${{ steps.restore.outputs.reachable }}"
          end=$(( $(date +%s) + 300*60 ))
          next=$(( $(date +%s) + 3600 ))
          while [ $(date +%s) -lt $end ]; do
            if [ "$SAFE" = "truetrue" ] && [ $(date +%s) -ge $next ]; then
              nice -n 19 ionice -c3 rsync -a --delete --exclude 'bulk/' --bwlimit=10M --timeout=1800 --exclude '/*.sh' \
                --backup --backup-dir="../trash/$(date +%F)" \
                /mnt/work/ "$STATE_HOST:$STATE_PATH/work/" && echo "$(date '+%H:%M') saved"
              next=$(( $(date +%s) + 3600 ))
            fi
            echo "$(date '+%H:%M:%S') alive"
            sleep 300
          done

      - name: Graceful stop
        if: always()
        run: |
          timeout 120 bash /mnt/work/shutdown.sh || true
          MYPID=$$
          for sig in TERM KILL; do
            for pid in $(pgrep -f '/mnt/work' 2>/dev/null || true); do
              [ "$pid" = "$MYPID" ] && continue
              [ "$pid" = "$PPID" ] && continue
              kill -"$sig" "$pid" 2>/dev/null || true
            done
            [ "$sig" = "TERM" ] && sleep 8
          done
          sync

      - name: Safety checks
        id: safe
        if: always()
        run: |
          COUNT=$(find /mnt/work -maxdepth 1 -mindepth 1 2>/dev/null | wc -l)
          SIZE=$(du -sm --exclude=bulk /mnt/work 2>/dev/null | cut -f1); SIZE=${SIZE:-0}
          echo "items=$COUNT size=${SIZE}MB"
          OK=true
          [ "$COUNT" -lt "$MIN_ITEMS" ] && OK=false && echo "::warning::too few items"
          [ "$SIZE" -gt "$MAX_STATE_MB" ] && OK=false && echo "::warning::too large"
          [ "${{ steps.restore.outputs.reachable }}" = "false" ] && OK=false && echo "::warning::server unreachable"
          echo "ok=$OK" >> $GITHUB_OUTPUT

      - name: Final save to server
        if: always() && steps.sshkey.outputs.enabled == 'true' && steps.safe.outputs.ok == 'true'
        run: |
          nice -n 19 ionice -c3 rsync -a --delete --exclude 'bulk/' --bwlimit=10M --timeout=1800 --exclude '/*.sh' \
            --backup --backup-dir="../trash/$(date +%F)" \
            /mnt/work/ "$STATE_HOST:$STATE_PATH/work/"
          rsync -az --delete --backup --backup-dir="../trash/$(date +%F)" \
            --exclude 'work/' --exclude 'runners/' --exclude '_diag/' \
            --exclude '.cache/' --exclude '.npm/' --exclude '.dotnet/' \
            --exclude '.credentials*' --exclude 'vps' \
            /home/runner/ "$STATE_HOST:$STATE_PATH/home/"
          ssh -n -o BatchMode=yes "$STATE_HOST" \
            "find '$STATE_PATH/trash' -maxdepth 1 -type d -mtime +7 -exec rm -rf {} + 2>/dev/null; true"

      - name: Final save to repo
        if: always() && steps.sshkey.outputs.enabled != 'true' && steps.safe.outputs.ok == 'true'
        run: |
          mkdir -p data
          rsync -a --delete --exclude 'bulk/' /mnt/work/ data/ 2>/dev/null || true
          git add -A data/

      - name: Heartbeat (keeps schedule alive)
        if: always()
        run: |
          date -u '+%Y-%m-%d %H:%M UTC' > .heartbeat
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .heartbeat
          if ! git diff --staged --quiet; then
            git commit -m "heartbeat $(date -u '+%F %H:%M')" || true
            git pull --rebase --autostash origin main || true
            git push || echo "::warning::push failed"
          fi

      - name: Tailscale logout
        if: always()
        run: sudo tailscale logout
