name: Linux VPS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af 2>/dev/null || true
          df -h / /mnt

      - name: Desktop + RDP
        env:
          RDP_PASS: ${{ secrets.RDP_PASS }}
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends xfce4 xfce4-terminal dbus-x11 xrdp
          echo "xfce4-session" > ~/.xsession
          sudo adduser xrdp ssl-cert
          echo "runner:$RDP_PASS" | sudo chpasswd
          sudo systemctl enable --now xrdp
          sudo systemctl restart xrdp

      - name: Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --reset \
            --authkey ${{ secrets.TS_KEY }} \
            --hostname github-runner
          echo "=== RDP → github-runner | user: runner ==="

      - name: Restore data
        run: |
          sudo mkdir -p /mnt/work && sudo chown -R runner:runner /mnt/work
          ln -sfn /mnt/work ~/work
          [ -d data ] && cp -r data/* ~/work/ 2>/dev/null || true

      # ══ برامجك هنا ══
      - name: Install apps
        run: sudo apt-get install -y firefox git python3-pip

      - name: Keep alive
        run: |
          end=$(( $(date +%s) + 330*60 ))
          while [ $(date +%s) -lt $end ]; do
            echo "$(date '+%H:%M:%S') alive"; sleep 300
          done

      - name: Save data
        if: always()
        run: |
          mkdir -p data && cp -r ~/work/* data/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || {
            git commit -m "autosave $(date '+%F %H:%M')"; git push; }

      - name: Tailscale logout
        if: always()
        run: sudo tailscale logout
