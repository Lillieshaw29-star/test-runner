name: Windows Test

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  windows-run:
    runs-on: windows-2019
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          netsh advfirewall firewall add rule name="RDP" dir=in localport=3389 protocol=TCP action=allow
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString "P@ssw0rd123!" -AsPlainText -Force)
          Restart-Service TermService -Force
        shell: powershell

      - name: Install Tailscale
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile tailscale-setup.exe
          Start-Process -FilePath .\tailscale-setup.exe -ArgumentList "/install /quiet" -Wait
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey ${{ secrets.TS_KEY }} --hostname github-runner
          Start-Sleep -Seconds 5
          $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "==============================="
          Write-Host "Tailscale IP: $ip"
          Write-Host "RDP: open Remote Desktop and connect to $ip"
          Write-Host "Username: runneradmin"
          Write-Host "Password: P@ssw0rd123!"
          Write-Host "==============================="
        shell: powershell

      - name: Restore Data
        run: |
          if (-not (Test-Path "data")) { New-Item -ItemType Directory "data" }
        shell: powershell

      - name: Keep Alive
        run: |
          $end = (Get-Date).AddMinutes(330)
          while ((Get-Date) -lt $end) {
            Write-Host "$(Get-Date) - Still running..."
            Start-Sleep -Seconds 60
          }
        shell: powershell

      - name: Save Data
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet; if (-not $?) {
            git commit -m "Auto-save data $(Get-Date -Format 'yyyy-MM-dd HH:mm')"
            git push
          }
        shell: powershell
