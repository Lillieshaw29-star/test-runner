name: Windows Test

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  windows-run:
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString "P@ssw0rd123!" -AsPlainText -Force)
        shell: powershell

      - name: Setup Ngrok
        run: |
          Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
          Expand-Archive ngrok.zip -DestinationPath .
          .\ngrok.exe config add-authtoken ${{ secrets.NGROK_TOKEN }}
          Start-Process -FilePath .\ngrok.exe -ArgumentList "tcp 3389"
          Start-Sleep -Seconds 10
          $tunnels = Invoke-RestMethod http://127.0.0.1:4040/api/tunnels
          $addr = $tunnels.tunnels[0].public_url -replace 'tcp://',''
          Write-Host "==============================="
          Write-Host "RDP Address: $addr"
          Write-Host "Username: runneradmin"
          Write-Host "Password: P@ssw0rd123!"
          Write-Host "==============================="
        shell: powershell

      - name: Restore Data
        run: |
          if (-not (Test-Path "data")) { New-Item -ItemType Directory "data" }
          Write-Host "Data folder ready"
        shell: powershell

      - name: Keep Alive
        run: |
          $end = (Get-Date).AddMinutes(330)
          while ((Get-Date) -lt $end) {
            Write-Host "$(Get-Date) - Still running..."
            Start-Sleep -Seconds 60
          }
        shell: powershell

      - name: Save Data
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet; if (-not $?) {
            git commit -m "Auto-save data $(Get-Date -Format 'yyyy-MM-dd HH:mm')"
            git push
          }
        shell: powershell
