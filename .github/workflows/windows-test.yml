name: Windows Test

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  windows-run:
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          netsh advfirewall firewall add rule name="RDP" dir=in localport=3389 protocol=TCP action=allow
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString "P@ssw0rd123!" -AsPlainText -Force)
          Restart-Service TermService -Force
        shell: powershell

      - name: Setup tmate SSH
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 330
        with:
          limit-access-to-actor: false

      - name: Restore Data
        if: always()
        run: |
          if (-not (Test-Path "data")) { New-Item -ItemType Directory "data" }
        shell: powershell

      - name: Save Data
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet; if (-not $?) {
            git commit -m "Auto-save data $(Get-Date -Format 'yyyy-MM-dd HH:mm')"
            git push
          }
        shell: powershell
